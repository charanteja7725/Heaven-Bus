services:
  - type: web
    name: heaven-bus-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx tsc -p tsconfig.server.json
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: heaven_bus
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_MODE
        value: sandbox
      - key: SEED_DEMO
        value: true
      - key: RESEND_API_KEY
        sync: false
      - key: JOURNEY_EMAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: HEAVEN-BUS
